<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cohort Domain Rating Report</title>
  <link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Matches react_components/src/Pages/CollegeProgram/ProgramView/ProgramView.module.scss */
  :root{
    --accent:#5486EC;
    --ink:#2E3446;
    --ink-muted:#73757B;
    --ink-faint:#A0A0A0;
    --border:#D5D5D5;
    --border-light:#E8EAED;
    --track-bg:#F0F2F5;
    --legend-bg:#F8F9FB;
    --surface:#FFFFFF;
    --page-bg:#EDEEF1;
    --gray:#95a5a6;
    --red:#e74c3c;
    --yellow:#f1c40f;
    --green:#2ecc71;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--page-bg);
    color:var(--ink);
  }
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border-light);
    padding:16px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar h1{
    font-size:18px;
    margin:0;
    font-weight:700;
    color:var(--ink);
  }
  select#cohortSelect{
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .contentOuter{
    max-width:1040px;
    margin:24px auto 64px;
    padding:0 16px;
  }
  .content{
    background:var(--surface);
    padding:48px 36px;
    display:flex;
    flex-direction:column;
    gap:32px;
    border-radius:10px;
  }
  @media (max-width:680px){
    .content{ padding:28px 18px; }
  }
  .pageHeader h2{
    margin:0 0 4px;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
  }
  .pageHeader p{
    margin:0;
    font-size:13px;
    color:var(--ink-muted);
  }
  .assessedBadge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#EEF2FF;
    color:var(--accent);
    font-weight:600;
    font-size:13px;
    padding:2px 8px;
    border-radius:12px;
  }
  .assessedSub{
    font-weight:400;
    font-size:11px;
    color:#7B92D6;
  }

  /* Section wrapper — statsSection */
  section.statsSection{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:24px;
    border:1px solid var(--border);
    border-radius:10px;
  }
  .sectionTitle{
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    border-left:4px solid var(--accent);
    padding-left:12px;
    margin:0;
  }

  /* Legend — boxed, with arrows */
  .legendBox{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px 4px;
    padding:12px 16px;
    background:var(--legend-bg);
    border-radius:8px;
    border:1px solid var(--border-light);
  }
  .legendItem{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .legendDot{
    width:10px;height:10px;border-radius:50%;flex-shrink:0;
  }
  .legendLevel{font-size:12px; font-weight:600; color:var(--ink);}
  .legendDesc{font-size:11px; color:var(--ink-muted); margin-left:3px;}
  .legendArrow{font-size:12px; color:#B0B3BB; padding:0 2px;}

  /* Competency grid */
  .domainGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .domainCard{
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .domainCardHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .domainName{margin:0; font-weight:700; font-size:14px; color:var(--ink);}
  .domainTotal{font-size:11px; color:var(--ink-muted); white-space:nowrap; flex-shrink:0;}
  .noDataNote{color:var(--red);}
  .levelRows{display:flex; flex-direction:column; gap:8px;}
  .levelRow{display:flex; align-items:center; gap:8px;}
  .levelRowLabel{width:92px; font-size:12px; font-weight:600; flex-shrink:0;}
  .levelRowTrack{
    flex:1;
    height:10px;
    background:var(--track-bg);
    border-radius:5px;
    overflow:hidden;
  }
  .levelRowFill{
    height:100%;
    border-radius:5px;
    min-width:2px;
    transition:width .4s ease;
  }
  .levelRowCount{width:28px; text-align:right; font-size:12px; font-weight:700; color:var(--ink); flex-shrink:0;}

  /* Job readiness bar chart */
  .barChartList{display:flex; flex-direction:column; gap:14px;}
  .barChartRow{display:flex; align-items:center; gap:12px;}
  .barChartLabelWrap{width:200px; flex-shrink:0; display:flex; flex-direction:column; gap:2px;}
  .barChartLabel{font-size:13px; font-weight:600;}
  .barChartDesc{font-size:11px; color:var(--ink-faint);}
  .barChartTrack{flex:1; height:12px; background:var(--track-bg); border-radius:6px; overflow:hidden;}
  .barChartFill{height:100%; border-radius:6px; min-width:2px; transition:width .4s ease;}
  .barChartCount{width:32px; text-align:right; font-size:13px; font-weight:700; color:var(--ink); flex-shrink:0;}

  /* Monthly activity stacked chart */
  .monthlyChartWrap{display:flex; flex-direction:column; gap:16px;}
  .stackedBarChart{
    display:flex;
    align-items:flex-end;
    gap:12px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .stackedBarCol{
    flex:1;
    min-width:34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    position:relative;
  }
  .stackedBar{
    width:100%;
    display:flex;
    flex-direction:column;
    border-radius:4px 4px 0 0;
    overflow:hidden;
    background:var(--track-bg);
  }
  .stackedBarSegment{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stackedBarCount{font-size:10px; font-weight:700; color:rgba(255,255,255,0.9);}
  .stackedBarMonth{
    font-size:11px;
    color:var(--ink-muted);
    text-align:center;
    white-space:nowrap;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    min-height:30px;
    justify-content:flex-start;
  }
  .stackedBarMonthCurrent{color:var(--accent); font-weight:600;}
  .currentTag{
    font-size:9px;
    font-weight:700;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .monthlyLegend{display:flex; gap:16px; flex-wrap:wrap;}
  .monthlyLegendItem{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink);}
  .monthlyLegendDot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .barTooltip{
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%);
    background:#1e2026;
    border:1px solid #2e3140;
    border-radius:8px;
    padding:10px 12px;
    min-width:160px;
    z-index:10;
    pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .barTooltipMonth{
    font-size:11px; font-weight:700; color:#a0a4b0;
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;
  }
  .barTooltipRow{display:flex; align-items:center; gap:6px; padding:2px 0;}
  .barTooltipDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .barTooltipLabel{font-size:11px; color:#c8ccd6; flex:1;}
  .barTooltipCount{font-size:12px; font-weight:700; color:#fff;}

  .emptyState{text-align:center; padding:60px 24px; color:var(--ink-muted); font-size:14px;}

  /* Learning Labs — reference-image style */
  .learningLabs{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .learningLabsHeader h3{
    margin:0 0 3px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .learningLabsHeader p{
    margin:0;
    font-size:12px;
    color:var(--ink-muted);
  }
  .labBlock{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    align-items:stretch;
  }
  .labSummary{
    border:1px solid var(--border-light);
    border-radius:10px;
    padding:18px 16px 14px;
    min-height:220px;
    display:flex;
    flex-direction:column;
  }
  .labSummaryTop{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .labIcon{
    width:54px;
    height:54px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .labIcon svg{width:29px;height:29px;}
  .labIcon.python{background:#1476ea;}
  .labIcon.dsa{background:#f59b0b;}
  .labIcon.sql{background:#13a85a;}
  .labSummaryTitle{
    margin:3px 0 7px;
    font-size:13px;
    line-height:1.25;
    font-weight:700;
    color:var(--ink);
  }
  .labProgressBadge{
    display:inline-block;
    padding:4px 9px;
    border-radius:14px;
    font-size:12px;
    line-height:1;
    font-weight:700;
  }
  .labProgressBadge.python{background:#e8f8ef;color:#1da35c;}
  .labProgressBadge.dsa,
  .labProgressBadge.sql{background:#fff1dc;color:#ee9914;}
  .labMeta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:34px;
  }
  .labMetaLabel{
    font-size:9px;
    color:var(--ink-muted);
    margin-bottom:7px;
  }
  .labMetaValue{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .labView{
    margin-top:auto;
    padding-top:22px;
    text-align:center;
    color:#2b83e8;
    font-size:12px;
    font-weight:700;
  }
  .labViewArrow{font-size:18px;vertical-align:-2px;margin-left:7px;}
  .labProgress{
    border:1px solid var(--border-light);
    border-radius:10px;
    padding:16px 18px 14px;
  }
  .labProgressHeader{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .labProgressTitle{
    margin:0 0 8px;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .labProgressNote{
    font-size:10px;
    color:var(--ink-muted);
    white-space:nowrap;
    padding-top:2px;
  }
  .labDownload{
    width:31px;
    height:31px;
    border:1px solid var(--border-light);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    flex-shrink:0;
  }
  .labDownload svg{width:17px;height:17px;}
  .labLegend{
    display:flex;
    flex-wrap:wrap;
    gap:7px 18px;
    margin-bottom:14px;
  }
  .labLegendItem{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    color:var(--ink);
  }
  .labLegendDot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
  .labSectionList{display:flex;flex-direction:column;gap:8px;}
  .labSectionRow{
    display:grid;
    grid-template-columns:165px 1fr 38px;
    gap:10px;
    align-items:center;
  }
  .labSectionLabel{
    display:flex;
    flex-direction:column;
    gap:1px;
    min-width:0;
  }
  .labSectionCode{font-size:10px;font-weight:700;color:var(--ink);}
  .labSectionStudents{font-size:9px;color:var(--ink-muted);}
  .labSectionTrack{
    height:12px;
    background:var(--track-bg);
    border-radius:6px;
    overflow:hidden;
    display:flex;
  }
  .labSegment{height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;}
  .labSegment.completed{background:#18b563;}
  .labSegment.eighty{background:#467ee6;}
  .labSegment.initiated{background:#f39a08;}
  .labSegment.notStarted{background:#d5d8de;color:#626774;}
  .labSectionPct{text-align:right;font-size:12px;font-weight:700;color:var(--ink);}
  @media (max-width:900px){
    .labBlock{grid-template-columns:1fr;}
  }
  @media (max-width:680px){
    .labSectionRow{grid-template-columns:105px 1fr 32px;}
    .labProgressNote{display:none;}
  }


  /* Assessments — reference-image style */
  .assessmentsSection{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .assessmentsHeader h3{
    margin:0 0 3px;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .assessmentsHeader p{
    margin:0;
    font-size:12px;
    color:var(--ink-muted);
  }
  .assessmentBlock{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    align-items:stretch;
  }
  .assessmentSummary{
    border:1px solid var(--border-light);
    border-radius:10px;
    padding:18px 16px 14px;
    min-height:150px;
    display:flex;
    flex-direction:column;
  }
  .assessmentSummaryTop{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .assessmentIcon{
    width:54px;
    height:54px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .assessmentIcon svg{width:29px;height:29px;}
  .assessmentIcon.python{background:#1476ea;}
  .assessmentIcon.dsa{background:#f59b0b;}
  .assessmentIcon.sql{background:#13a85a;}
  .assessmentSummaryTitle{
    margin:3px 0 7px;
    font-size:13px;
    line-height:1.25;
    font-weight:700;
    color:var(--ink);
  }
  .assessmentProgressBadge{
    display:inline-block;
    padding:4px 9px;
    border-radius:14px;
    font-size:12px;
    line-height:1;
    font-weight:700;
  }
  .assessmentProgressBadge.python{background:#e8f8ef;color:#1da35c;}
  .assessmentProgressBadge.dsa,
  .assessmentProgressBadge.sql{background:#fff1dc;color:#ee9914;}
  .assessmentMeta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:18px;
  }
  .assessmentMetaLabel{
    font-size:9px;
    color:var(--ink-muted);
    margin-bottom:7px;
  }
  .assessmentMetaValue{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .assessmentView{
    margin-top:auto;
    text-align:right;
    color:#2b83e8;
    font-size:11px;
    font-weight:700;
  }
  .assessmentViewArrow{font-size:17px;vertical-align:-2px;margin-left:5px;}
  .assessmentTableWrap{
    border:1px solid var(--border-light);
    border-radius:10px;
    padding:10px 18px 9px;
  }
  .assessmentTableHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .assessmentTableTitle{
    margin:0 0 8px;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .assessmentDownload{
    width:31px;
    height:31px;
    border:1px solid var(--border-light);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    flex-shrink:0;
  }
  .assessmentDownload svg{width:17px;height:17px;}
  .assessmentTable{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  .assessmentTable th{
    text-align:left;
    font-size:10px;
    font-weight:600;
    color:var(--ink-muted);
    padding:0 0 6px;
    border-bottom:1px solid var(--border-light);
  }
  .assessmentTable td{
    font-size:11px;
    font-weight:600;
    color:var(--ink);
    padding:3px 0;
  }
  .assessmentTable th:nth-child(1), .assessmentTable td:nth-child(1){width:28%;}
  .assessmentTable th:nth-child(2), .assessmentTable td:nth-child(2){width:22%;}
  .assessmentTable th:nth-child(3), .assessmentTable td:nth-child(3){width:25%;}
  .assessmentTable th:nth-child(4), .assessmentTable td:nth-child(4){width:25%;text-align:right;}
  @media (max-width:900px){
    .assessmentBlock{grid-template-columns:1fr;}
  }


  .topbarActions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .downloadReportBtn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:8px 13px;
    border:1px solid var(--accent);
    border-radius:6px;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease, transform .05s ease;
  }
  .downloadReportBtn:hover{opacity:.92;}
  .downloadReportBtn:active{transform:translateY(1px);}
  .downloadReportBtn:disabled{opacity:.65;cursor:wait;}
  .downloadReportBtn svg{width:17px;height:17px;}
  @media (max-width:680px){
    .topbarActions{width:100%;}
    .topbarActions select#cohortSelect{flex:1;}
    .downloadReportBtn{flex:1;}
  }
  .pdf-exporting .topbar{position:static;}
  .pdf-exporting .downloadReportBtn{display:none;}
  .pdf-exporting .contentOuter{max-width:none;margin:0;padding:0;}
  .pdf-exporting .content{border-radius:0;padding:28px;}

</style>
</head>
<body>

<div class="topbar">
  <h1>Cohort Domain Rating Report</h1>
  <div class="topbarActions">
    <select id="cohortSelect">
      <option value="kargil">CU - UP_DCPD_Kargil Batch</option>
      <option value="dcpdf">CU DCPDF - BE 2028 PO &amp; MCA 2026 PO</option>
    </select>
    <button id="downloadPdfBtn" class="downloadReportBtn" type="button" title="Download current cohort report as PDF">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Download PDF</span>
    </button>
  </div>
</div>

<div class="contentOuter">
  <div class="content" id="content"></div>
</div>

function escapeHtml(s){

function competencyCardHtml(key, distribution, totalStudents){

  const noData = totalStudents - domainTotal;
  const rows = LEVELS.map(level => {
    const count = distribution[level];
    const pct = (count / maxCount) * 100;
    return `
      <div class="levelRow">
        <span class="levelRowLabel" style="color:${LEVEL_COLORS[level]}">${level}</span>
        <div class="levelRowTrack"><div class="levelRowFill" style="width:${pct}%;background:${LEVEL_COLORS[level]}"></div></div>
        <span class="levelRowCount">${count}</span>
      </div>`;
  }).join('');
  return `
    <div class="domainCard">
      <div class="domainCardHeader">
        <p class="domainName">${COMPETENCY_LABELS[key]}</p>
        <span class="domainTotal">${domainTotal} of ${totalStudents}${noData > 0 ? ` <span class="noDataNote">(${noData} no data)</span>` : ''}</span>
      </div>
      <div class="levelRows">${rows}</div>
    </div>`;
}

function normalizeLabCounts(seed, total){
  const sum = seed.reduce((a,b) => a+b, 0);
  if (!sum || !total) return [0,0,0,total];
  const raw = seed.map(v => v * total / sum);
  const base = raw.map(Math.floor);
  let remainder = total - base.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i,frac:v-base[i]})).sort((a,b)=>b.frac-a.frac);
  for(let i=0;i<remainder;i++) base[order[i % order.length].i]++;
  return base;
}

function learningLabHtml(lab, totalStudents){
  const rows = lab.sections.map(([code, seed]) => {

      <div class="labSegment ${key}" style="width:${totalStudents ? (count/totalStudents)*100 : 0}%">

          <span class="labSectionStudents">${totalStudents} students</span>
        </div>
        <div class="labSectionTrack">${segments}</div>

  }).join('');

  return `

function render(cohortKey){

    return;
  }

  const { label, subtitle, total_students, assessed_count, job_readiness, competency, monthly_activity } = stats;
  const assessedPct = total_students ? Math.round((assessed_count / total_students) * 100) : 0;

  el.innerHTML = `
    <div class="pageHeader">
      <h2>${escapeHtml(label)}</h2>
      <p>
        ${total_students} total students
        &middot;
        <span class="assessedBadge">${assessedPct}% assessed<span class="assessedSub">${assessed_count}/${total_students}</span></span>

    </section>

    <section class="statsSection">
      <h3 class="sectionTitle">Job Readiness</h3>
      ${jobReadinessHtml(job_readiness, total_students)}
    </section>

    ${learningLabsHtml(total_students)}

    ${assessmentsHtml(total_students)}
  `;
}


function downloadCurrentCohortPdf(){
  const btn = document.getElementById('downloadPdfBtn');
  const cohortKey = document.getElementById('cohortSelect').value;
  const stats = DATA[cohortKey];

  if (!stats) return;

  if (typeof html2pdf === 'undefined') {
    alert('PDF export library could not be loaded. Please check your internet connection and try again.');
    return;
  }

  const report = document.getElementById('content');
  const originalText = btn.querySelector('span').textContent;

  btn.disabled = true;
  btn.querySelector('span').textContent = 'Preparing PDF...';
  document.body.classList.add('pdf-exporting');

  const safeName = stats.label
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .slice(0, 80);

  const options = {
    margin: [8, 8, 8, 8],
    filename: `${safeName || 'cohort'}-domain-rating-report.pdf`,
    image: {type:'jpeg', quality:0.98},
    html2canvas: {
      scale:2,
      useCORS:true,
      backgroundColor:'#EDEEF1',
      logging:false
    },
    jsPDF: {
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    },
    pagebreak: {
      mode:['css','legacy'],
      avoid:['.statsSection','.labBlock','.assessmentBlock','.domainCard']
    }
  };

  html2pdf()
    .set(options)
    .from(report)
    .save()
    .then(() => {
      document.body.classList.remove('pdf-exporting');
      btn.disabled = false;
      btn.querySelector('span').textContent = originalText;
    })
    .catch((error) => {
      console.error('PDF export failed:', error);
      document.body.classList.remove('pdf-exporting');
      btn.disabled = false;
      btn.querySelector('span').textContent = originalText;
      alert('Could not generate the PDF. Please try again.');
    });
}

document.getElementById('downloadPdfBtn').addEventListener('click', downloadCurrentCohortPdf);

document.getElementById('cohortSelect').addEventListener('change', (e) => render(e.target.value));
