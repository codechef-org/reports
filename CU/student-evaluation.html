<style>
  /* same look as cu_fetch/report_template.html */
  :root{
    --accent:#5486EC; --accent-soft:#EEF2FF;
    --ink:#2E3446; --ink-muted:#73757B; --ink-faint:#A0A0A0;
    --border:#D5D5D5; --border-light:#E8EAED; --track-bg:#F0F2F5; --legend-bg:#F8F9FB;
    --surface:#FFFFFF; --page-bg:#EDEEF1;
    --red:#e74c3c; --orange:#f39a08; --green:#18b563;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--page-bg);color:var(--ink);}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border-light);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:18px;margin:0;font-weight:700;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{opacity:.92}
  .btn.ghost{background:var(--surface);color:var(--accent)}
  .btn svg{width:16px;height:16px}
  .contentOuter{max-width:1180px;margin:24px auto 64px;padding:0 16px;}
  .content{background:var(--surface);padding:36px;display:flex;flex-direction:column;gap:28px;border-radius:10px;}
  @media (max-width:680px){.content{padding:22px 14px}.topbar{padding:14px 16px}}
  [hidden]{display:none!important}

  .pageHeader h2{margin:0 0 4px;font-size:22px;font-weight:700}
  .pageHeader p{margin:0;font-size:13px;color:var(--ink-muted)}
  .formula{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
  .formula .pill{padding:5px 12px;border-radius:16px;background:var(--accent-soft);color:var(--ink);font-weight:600}
  .formula .op{color:var(--ink-muted);font-weight:700}

  .filters{padding:16px 20px;background:var(--legend-bg);border:1px solid var(--border-light);border-radius:10px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end}
  .fgroup{display:flex;flex-direction:column;gap:6px}
  .flabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  select,input[type=search]{font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);width:220px;max-width:100%}
  input[type=search]{font-weight:500}
  .reset{font:inherit;font-size:13px;font-weight:600;background:var(--accent-soft);border:none;color:var(--accent);cursor:pointer;padding:7px 12px;border-radius:6px}

  section.box{display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid var(--border);border-radius:10px;min-width:0}
  .secHead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
  .sectionTitle{font-size:18px;font-weight:700;border-left:4px solid var(--accent);padding-left:12px;margin:0;}
  .secNote{font-size:12px;color:var(--ink-muted)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .tile{border:1px solid var(--border-light);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
  .tile .l{font-size:11px;color:var(--ink-muted);font-weight:600}
  .tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--ink-muted);font-weight:600}
  .tile .s{font-size:11px;color:var(--ink-faint)}

  .two{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
  @media (max-width:860px){.two{grid-template-columns:1fr}}
  .chartTitle{font-size:13px;font-weight:700;margin:0 0 10px}
  .hist{display:flex;align-items:flex-end;gap:2px;height:180px;border-bottom:1px solid var(--border);padding-top:18px}
  .hcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default}
  .hbar{width:70%;max-width:46px;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}
  .hcol:hover .hbar{opacity:.8}
  .hval{font-size:11px;color:var(--ink-muted);font-weight:600;margin-bottom:3px;font-variant-numeric:tabular-nums}
  .hlabels{display:flex;gap:2px;margin-top:6px}
  .hlabels span{flex:1;text-align:center;font-size:11px;color:var(--ink-muted)}
  .meters{display:flex;flex-direction:column;gap:14px}
  .meter .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .meter .top b{font-variant-numeric:tabular-nums}
  .meter .top span{color:var(--ink-muted)}
  .track{height:10px;background:var(--track-bg);border-radius:5px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:5px}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;white-space:nowrap}

  .tableWrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border-light);white-space:nowrap}
  th{background:var(--legend-bg);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:700;cursor:pointer;user-select:none;position:sticky;top:0}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th[aria-sort="ascending"]::after{content:" ▲"} th[aria-sort="descending"]::after{content:" ▼"}
  tbody tr:hover{background:#FAFBFD}
  td a{color:var(--accent);text-decoration:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
  .tag.ok{background:#E3F7EC;color:#0f7a43} .tag.no{background:#FDECEA;color:#b0352a}
  .bar{display:inline-block;width:46px;height:6px;background:var(--track-bg);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink-muted)}
  .pager button{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  .foot{font-size:12px;color:var(--ink-muted);line-height:1.6}
</style>
</head>

  let data = stuData(R);
  if (all) data.forEach(d => d.r.ws.forEach((w, i) => d['w' + i] = w.att ? w.total : w.total + ' *'));
  data = table($('stuTable'), 'stu', cols, data);
  const pages = Math.max(1, Math.ceil(data.length / PER));
  st.page = Math.min(st.page, pages - 1);
  tbody($('stuTable'), cols, data.slice(st.page * PER, (st.page + 1) * PER));
  $('pager').innerHTML = `<span>${data.length} students${all ? ' · * = did not take that week (path marks only)' : ''}</span>` +
    `<span><button id="pPrev" ${st.page ? '' : 'disabled'}>‹ Prev</button> Page ${st.page + 1} of ${pages} <button id="pNext" ${st.page < pages - 1 ? '' : 'disabled'}>Next ›</button></span>`;
  $('pPrev').onclick = () => { st.page--; renderStudents(rows()); };
  $('pNext').onclick = () => { st.page++; renderStudents(rows()); };
}

function render() {
  renderFilters(); renderHeader();
  const R = rows();
  renderOverview(R); renderClass(R); renderStudents(R);
}

// ---- Excel ----
function studentSheet(R) {
  const out = [];
  R.forEach(r => {
    const base = {'Roll No': r.s.roll, 'Name': r.s.name, 'CC Username': r.s.user, 'User Id': r.s.uid, 'Class': r.s.cls, 'Division': r.s.div};
    A.forEach((a, i) => {
      const w = wk(a, r.s), p = a.name + ' ';
      if (st.a !== 'all' && st.a !== i) return;
      Object.assign(base, {[p + 'Attempted']: w.att ? 'Yes' : 'No', [p + 'Paper']: w.paper || '',
        [p + `Coding judge /${a.coding_max}`]: w.cj, [p + `Coding AI /${a.coding_max}`]: w.ca, [p + `Coding best /${a.coding_max}`]: w.coding, [p + `Viva /${a.viva_max}`]: w.viva,
        [p + `LP solved /${a.lp_total}`]: w.lp, [p + 'LP %']: r1(w.lpPct), [p + `PP solved /${a.pp_total}`]: w.pp, [p + 'PP %']: r1(w.ppPct),
        [p + `Path /${a.path_max}`]: w.path, [p + `Total /${maxOf(a).total}`]: w.total});
    });
    if (st.a === 'all' && A.length > 1) base[`Overall /${selMax().total}`] = r.total;
    out.push(base);
  });
  return out;
}
function classSheet(R) {
  const m = selMax();
  return classRows(R).sort((a, b) => a.cls.localeCompare(b.cls)).map(d => ({'Class': d.cls, 'Students': d.n, 'Attempted': d.att, 'Attempted %': d.attPct,
    [`Avg coding /${m.coding}`]: d.coding, [`Avg viva /${m.viva}`]: d.viva, 'LP %': d.lpPct, 'PP %': d.ppPct,
    [`Avg path /${m.path}`]: d.path, [`Avg total /${m.total}`]: d.total}));
}
function filterNote() {
  return [st.a === 'all' ? 'All weeks' : A[st.a].name, st.cls || 'All classes', st.div ? 'Div ' + st.div : 'All divisions', st.q ? `search "${st.q}"` : ''].filter(Boolean).join(' · ');
}
function download(kind) {
  const R = rows(), wb = XLSX.utils.book_new();
  const add = (name, data) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.length ? data : [{}]), name);
  if (kind !== 'students') add('Class-wise', classSheet(R));
  if (kind !== 'class') add('Students', studentSheet(stuData(R).map(d => d.r)));
  if (kind === 'all') add('About', [{'Report': D.title}, {'Report': D.cohort}, {'Report': 'Data as of ' + D.asof}, {'Report': 'Filters: ' + filterNote()}]);
  XLSX.writeFile(wb, `${D.title} - ${kind === 'class' ? 'Class-wise' : kind === 'students' ? 'Students' : 'Report'}.xlsx`);
}

// ---- init ----
$('title').textContent = D.title;
document.title = D.title;
$('cohort').textContent = D.cohort;
$('asof').textContent = `Data as of ${D.asof} · ${S.length} students`;
const classes = [...new Set(S.map(s => s.cls).filter(Boolean))].sort();
$('fClass').innerHTML = '<option value="">All classes</option>' + classes.map(c => `<option>${esc(c)}</option>`).join('');
$('fClass').onchange = e => { st.cls = e.target.value; st.page = 0; render(); };
let qt; $('fSearch').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value.trim(); st.page = 0; render(); }, 150); };
$('reset').onclick = () => { Object.assign(st, {a: A.length > 1 ? 'all' : 0, cls: '', div: '', q: '', status: 'all', page: 0}); $('fClass').value = ''; $('fSearch').value = ''; render(); };
$('dlAll').onclick = () => download('all');
document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => download(b.dataset.dl));
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]'), tip = $('tip');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});
$('foot').innerHTML = `Coding = for each code problem, the better of the judge's marks (test cases passed) and the AI evaluation's marks (best AI-evaluated submission made before the assessment score was computed, as in the site's assessment report); Judge / AI columns show each one summed over the paper. Viva = marks on the short-answer problems (AI-graded by the site). ` +
  `LP / PP = problems solved on that week's learning-path sub-module and practice module (concept lessons not counted), lifetime as of the data date, so they keep rising after the assessment. ` +
  `Not attempted = no attempt on the assessment; those students still get their path marks.`;
render();
</script>
</body>
