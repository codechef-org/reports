<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DCPD Kargil Cohort Progress Report</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Matches react_components/src/Pages/CollegeProgram/ProgramView/ProgramView.module.scss */
  :root{
    --accent:#5486EC; --accent-soft:#EEF2FF;
    --ink:#2E3446; --ink-muted:#73757B; --ink-faint:#A0A0A0;
    --border:#D5D5D5; --border-light:#E8EAED; --track-bg:#F0F2F5; --legend-bg:#F8F9FB;
    --surface:#FFFFFF; --page-bg:#EDEEF1;
    --gray:#95a5a6; --red:#e74c3c; --yellow:#f1c40f; --green:#2ecc71; --orange:#f39a08; --blue:#467ee6; --purple:#9b59b6;
    --done:#18b563; --started:#f39a08; --none:#d5d8de;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--page-bg);color:var(--ink);}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border-light);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;}
  .downloadReportBtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .downloadReportBtn:hover{opacity:.92}
  .downloadReportBtn:disabled{opacity:.65;cursor:wait}
  .downloadReportBtn svg{width:17px;height:17px}
  .contentOuter{max-width:1080px;margin:24px auto 64px;padding:0 16px;}
  .content{background:var(--surface);padding:40px 36px;display:flex;flex-direction:column;gap:28px;border-radius:10px;}
  @media (max-width:680px){.content{padding:24px 16px}.topbar{padding:14px 16px}}

  /* Filters */
  .filters{padding:16px 20px;background:var(--legend-bg);border:1px solid var(--border-light);border-radius:10px;}
  .filterChips{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end}
  [hidden]{display:none!important}
  .fgroup{display:flex;flex-direction:column;gap:6px}
  .flabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .filterFoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light)}
  .chip{font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:disabled{opacity:.4;cursor:not-allowed}
  select{font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);width:220px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reset{font:inherit;font-size:13px;font-weight:600;background:var(--accent-soft);border:none;color:var(--accent);cursor:pointer;padding:7px 12px;border-radius:6px;flex-shrink:0}
  .activeNote{flex:1;min-width:200px;font-size:12px;color:var(--ink-muted)}
  .activeNote strong{color:var(--accent)}

  .pageHeader h2{margin:0 0 4px;font-size:22px;font-weight:700}
  .pageHeader p{margin:0;font-size:13px;color:var(--ink-muted)}

  section.statsSection{display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid var(--border);border-radius:10px;}
  .secHead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
  .sectionTitle{font-size:18px;font-weight:700;border-left:4px solid var(--accent);padding-left:12px;margin:0;}
  .secNote{font-size:12px;color:var(--ink-muted)}

  /* KPI tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tile{border:1px solid var(--border-light);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
  .tile .l{font-size:11px;color:var(--ink-muted);font-weight:600}
  .tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tile .s{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .star{color:var(--red);font-weight:700}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .cardHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .cardTitle{margin:0;font-weight:700;font-size:14px}
  .cardSub{font-size:11px;color:var(--ink-muted)}

  .levelRows{display:flex;flex-direction:column;gap:8px}
  .levelRow{display:flex;align-items:center;gap:8px}
  .levelRowLabel{width:130px;font-size:12px;font-weight:600;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .levelRowTrack{flex:1;height:10px;background:var(--track-bg);border-radius:5px;overflow:hidden;display:flex}
  .levelRowFill{height:100%;min-width:0;transition:width .4s ease}
  .levelRowCount{width:78px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
  .levelRowCount span{font-weight:400;color:var(--ink-muted)}

  /* Path blocks — Learning Labs style */
  .labBlock{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:stretch}
  @media (max-width:900px){.labBlock{grid-template-columns:1fr}}
  .labSummary{border:1px solid var(--border-light);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
  .labSummaryTop{display:flex;align-items:flex-start;gap:12px}
  .labIcon{width:54px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .labIcon svg{width:29px;height:29px}
  .labSummaryTitle{margin:3px 0 7px;font-size:14px;font-weight:700}
  .labProgressBadge{display:inline-block;padding:4px 9px;border-radius:14px;font-size:12px;line-height:1;font-weight:700;background:#e8f8ef;color:#1da35c}
  .labProgressBadge.warn{background:#fff1dc;color:#ee9914}
  .labMeta{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px}
  .labMetaLabel{font-size:10px;color:var(--ink-muted);margin-bottom:4px}
  .labMetaValue{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .labProgress{border:1px solid var(--border-light);border-radius:10px;padding:16px 18px 14px;min-width:0}
  .labProgressTitle{margin:0 0 8px;font-size:14px;font-weight:700}
  .labLegend{display:flex;flex-wrap:wrap;gap:7px 18px;margin-bottom:12px}
  .labLegendItem{display:flex;align-items:center;gap:6px;font-size:11px}
  .labLegendDot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .labSectionList{display:flex;flex-direction:column;gap:8px}
  .labSectionRow{display:grid;grid-template-columns:190px 1fr 44px;gap:10px;align-items:center}
  .pathList .labSectionRow{grid-template-columns:250px 1fr 44px}
  .pathList .labSectionCode{white-space:normal}
  @media (max-width:680px){.labSectionRow,.pathList .labSectionRow{grid-template-columns:110px 1fr 38px}}
  .labSectionLabel{display:flex;flex-direction:column;gap:1px;min-width:0}
  .labSectionCode{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .labSectionStudents{font-size:10px;color:var(--ink-muted)}
  .labSectionTrack{height:12px;background:var(--track-bg);border-radius:6px;overflow:hidden;display:flex}
  .labSegment{height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
  .labSectionPct{text-align:right;font-size:12px;font-weight:700}
  .more{font:inherit;font-size:12px;font-weight:700;border:none;background:none;color:var(--accent);cursor:pointer;padding:6px 0 0;text-align:left}

  /* Tables */
  .tw{overflow:auto;max-height:520px;border:1px solid var(--border-light);border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border-light);font-variant-numeric:tabular-nums}
  th{position:sticky;top:0;background:var(--legend-bg);font-size:10px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;z-index:1}
  th.t,td.t{text-align:left}
  td{font-weight:600}
  tbody tr:hover td{background:var(--accent-soft)}
  .zero{color:var(--ink-faint);font-weight:400}

  /* Readiness (from domain rating report) */
  .legendBox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:12px 16px;background:var(--legend-bg);border-radius:8px;border:1px solid var(--border-light)}
  .legendItem{display:flex;align-items:center;gap:7px}
  .legendDot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .legendLevel{font-size:12px;font-weight:600}
  .legendDesc{font-size:11px;color:var(--ink-muted);margin-left:3px}
  .legendArrow{font-size:12px;color:#B0B3BB;padding:0 2px}
  .domainGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .domainCard{border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .domainCardHeader{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .domainName{margin:0;font-weight:700;font-size:14px}
  .domainTotal{font-size:11px;color:var(--ink-muted);white-space:nowrap}
  .dLevelLabel{width:92px;font-size:12px;font-weight:600;flex-shrink:0}
  .dCount{width:28px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0}
  .barChartList{display:flex;flex-direction:column;gap:14px}
  .barChartRow{display:flex;align-items:center;gap:12px}
  .barChartLabelWrap{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
  .barChartLabel{font-size:13px;font-weight:600}
  .barChartDesc{font-size:11px;color:var(--ink-faint)}
  .barChartTrack{flex:1;height:12px;background:var(--track-bg);border-radius:6px;overflow:hidden}
  .barChartFill{height:100%;border-radius:6px;min-width:2px}
  .barChartCount{width:40px;text-align:right;font-size:13px;font-weight:700;flex-shrink:0}
  @media (max-width:680px){.barChartLabelWrap{width:130px}}
  .emptyState{text-align:center;padding:36px 24px;color:var(--ink-muted);font-size:13px;border:1px dashed var(--border);border-radius:8px}
  .prompt{padding:24px;text-align:center;color:var(--ink-muted);border:1px dashed var(--border);border-radius:8px;font-size:13px}
  .prompt strong{color:var(--accent)}
  input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);min-width:240px}
  .footnote{font-size:12px;color:var(--ink-muted);border-top:1px solid var(--border-light);padding-top:14px;line-height:1.6}

  .reset:disabled{opacity:.4;cursor:not-allowed}
  .uTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #f-Faculty{width:280px}
  /* searchable dropdown over a hidden <select> (Section, Faculty) */
  th.fOwn,td.fOwn{border-left:2px solid var(--border)}
  .combo{position:relative;width:220px;max-width:100%}
  .combo.wide{width:280px}
  .combo select{display:none}
  .comboInput{font:inherit;font-size:13px;font-weight:600;padding:6px 26px 6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box;text-overflow:ellipsis;cursor:pointer}
  .comboInput:focus{outline:2px solid var(--accent);outline-offset:-1px;cursor:text}
  .combo::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-muted);pointer-events:none}
  .comboList{position:absolute;z-index:50;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:420px;max-height:320px;overflow:auto;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .comboList li{padding:6px 9px;border-radius:5px;font-size:13px;cursor:pointer;white-space:nowrap}
  .comboList li.on{background:var(--accent-soft);color:var(--accent)}
  .comboList li.sel{font-weight:700}
  .comboList .none{color:var(--ink-muted);cursor:default}
</style>
</head>
<body>

<div class="topbar">
  <h1>DCPD Kargil Cohort Progress Report</h1>
  <button id="downloadXlsxBtn" class="downloadReportBtn" type="button" title="All the report's data for the current filter, one sheet per dataset">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Download Excel</span>
  </button>
</div>

<div class="contentOuter"><div class="content" id="content">

  <div class="filters" id="filters">
    <div class="filterChips">
      <div class="fgroup"><span class="flabel">College</span><div class="chips" id="f-Clg"></div></div>

      <div class="fgroup"><label class="flabel" for="f-Section-q">Section</label><div class="combo"><input class="comboInput" id="f-Section-q" autocomplete="off" spellcheck="false"><select id="f-Section"></select></div></div>
      <div class="fgroup"><span class="flabel">Group</span><div class="chips" id="f-Group"></div></div>

    </div>
    <div class="filterFoot">
      <button class="reset" id="reset" type="button">Clear filters</button>
      <div class="activeNote" id="activeNote"></div>
    </div>
  </div>

  <div class="pageHeader" id="pageHeader"></div>

  <section class="statsSection" id="secCommon"></section>
  <section class="statsSection" id="secCollege"></section>
  <section class="statsSection" id="secLearning"></section>
  <section class="statsSection" id="secPractice"></section>
  <section class="statsSection" id="secContest"></section>
  <section class="statsSection" id="secFacPath"></section>
  <section class="statsSection" id="secPlacement"></section>
  <section class="statsSection" id="secJob"></section>

  <section class="statsSection" id="secUsers">
    <div class="secHead"><h3 class="sectionTitle" id="uTitle">Student-wise Data</h3>
      <div class="uTools">
        <input type="search" id="uSearch" placeholder="Search name, roll no or username">
        <button class="reset" id="uDownload" type="button" disabled>Download CSV</button>
      </div></div>
    <div id="uBody"></div>
  </section>

</div></div>

const BCOL=['#e74c3c','#f39c12','#f1c40f','#a3cb38','#2ecc71','#1abc9c','#5486EC','#9b59b6'];
const bucketOf=p=>{for(let i=0;i<BUCKETS.length;i++)if(p<=BUCKETS[i][2])return i;return 7};
const rows=D.rows.map(r=>({c:r.slice(0,5),m:r.slice(5,15),u:r.slice(15),b:bucketOf(r[5]),x:X.d[r[17]]||null}));
// the cohort report (build_report.py --cohorts): students are grouped only by cohort (kept in the College slot, their
// class in the Section slot); no year / section / group / faculty filters and no faculty section or sheets
const COHORT=X.mode==='cohort';

const st={sel:{Clg:new Set(),Year:new Set(),Group:new Set()},section:'',fac:'',fpath:'All',q:'',limit:200,usort:{k:'m0',asc:false}};
const fmt=n=>Number(n).toLocaleString('en-IN');
const pct=(a,b)=>b?100*a/b:0;
const p1=v=>v.toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=(f,fn)=>f.reduce((s,r)=>s+(fn(r)?1:0),0);
const sum=(f,i)=>f.reduce((s,r)=>s+r.m[i],0);
const xv=(r,k)=>r.x?r.x[XI[k]]:null;
const xs=(f,k)=>f.reduce((s,r)=>s+(xv(r,k)||0),0);
const xm=f=>f.filter(r=>r.x);
const hm=m=>m>=60?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.round(m)+'m';
// path started/completed: use replica (export is an older snapshot); college paths are tracked separately
rows.forEach(r=>{r.pp=(X.pp[r.u[2]]||'').split(';').filter(Boolean).map(t=>t.split(':').map(Number))});
rows.forEach(r=>{r.ap=(X.ap[r.u[2]]||'').split(';').filter(Boolean).map(t=>t.split(':').map(Number))});
// detail behind the counts, for the CSV downloads: r.sp = [[problem_id, contest_id, source, date10, best submission id], ...] one per
// (problem, contest) solved since X.since; r.as = [[assessment contest id, score % or '']] assessments started
rows.forEach(r=>{r.sp=X.sp[r.u[2]]||[];r.as=(X.as[r.u[2]]||'').split(';').filter(Boolean).map(t=>{const [c,p]=t.split(':');return [+c,p||'']})});
if(X.since)rows.forEach(r=>{r.m[0]=xv(r,'all_solved')||0;r.m[8]=xv(r,'wed_contests')||0;r.m[9]=xv(r,'mon_contests')||0;r.b=bucketOf(r.m[0])});
const WIN=X.since?'since '+X.since.replace(/ \d{4}$/,''):'last 30 days';
rows.forEach(r=>{if(r.x){r.m[1]=xv(r,'lp_started');r.m[2]=xv(r,'lp_completed');r.m[3]=xv(r,'pp_started');r.m[4]=xv(r,'pp_completed')}});
const SRC=[['Assessments','src_assessment','#9b59b6'],['Learning paths','src_learning','#1476ea'],['Practice paths','src_practice','#13a85a'],['College paths','src_college','#f39a08'],['CP contests','src_cp','#f59b0b'],['DSA Mondays','src_dsa_monday','#e84393'],['Other contests','src_contest','#95a5a6']];

function passes(r,skip){
  if(skip!=='Clg'&&st.sel.Clg.size&&!st.sel.Clg.has(r.c[0]))return false;
  if(skip!=='Year'&&st.sel.Year.size&&!st.sel.Year.has(r.c[1]))return false;
  if(skip!=='Section'&&st.section!==''&&r.c[3]!==+st.section)return false;
  if(skip!=='Group'&&st.sel.Group.size&&!st.sel.Group.has(r.c[4]))return false;
  if(skip!=='Faculty'&&st.fac!==''&&!FAC[+st.fac].rows.has(r))return false;
  return true}
const anyFilter=()=>st.section!==''||st.fac!==''||Object.values(st.sel).some(s=>s.size);

/* ---------- faculty: X.fac = [name, username, block, [[subject, section index, group A/B/ALL]], [sections not in the list]] ---------- */
const FAC=X.fac.map(([n,u,b,asg,miss])=>{
  const keys=new Set(asg.map(([,sec,g])=>sec+'|'+(g==='ALL'?'*':g)));
  const has=r=>keys.has(r.c[3]+'|*')||keys.has(r.c[3]+'|'+D.cats.Group[r.c[4]]);
  return {n,u,b,asg,miss,rows:new Set(rows.filter(has)),
    subjects:[...new Set(asg.map(a=>a[0]))],
    // one entry per section: the whole class, or the student groups taught ("25BCS-801 (A)")
    sections:[...new Set(asg.map(a=>a[1]))].map(sec=>{const gs=new Set(asg.filter(a=>a[1]===sec).map(a=>a[2]));
      return D.cats.Section[sec]+(gs.has('ALL')||(gs.has('A')&&gs.has('B'))?'':' ('+[...gs].sort().join(', ')+')')}),
    // the subjects this faculty teaches this student
    subOf:r=>[...new Set(asg.filter(([,sec,g])=>sec===r.c[3]&&(g==='ALL'||g===D.cats.Group[r.c[4]])).map(a=>a[0]))]}});
// a subject's college learning path (by name, over its versions); subjects without one have no path column
const SUBJ_PATH={'Advanced Data Structures':'advanced data structures and algorithms','Object Oriented Programming':'objects oriented programming using java',
  'Database Management System':'database management systems','Competitive Coding - II':'competitive coding - ii'};
// the student's status on a subject's college path: -1 not assigned, 0 not started, 1 started, 2 completed
const subjPathStatus=(r,sub)=>{const want=SUBJ_PATH[sub];if(!want)return null;
  return r.ap.reduce((m,[p,s])=>CIDS.has(p)&&X.paths[p][0].trim().toLowerCase()===want?Math.max(m,s):m,-1)};
const filtered=()=>rows.filter(r=>passes(r,null));

/* ---------- filters ---------- */
function buildChips(){
  [['Clg',0],['Year',1],['Group',4]].forEach(([d,di])=>{
    const el=document.getElementById('f-'+d);el.innerHTML='';
    D.cats[d].forEach((v,i)=>{
      if(d==='Clg'&&v==='4th Yr')return;   // 4th-year students are picked by Year only (they have no AIT / UIE split)
      const on=st.sel[d].has(i),avail=on||rows.some(r=>r.c[di]===i&&passes(r,d));
      const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=d==='Group'?'Group '+v:v;
      b.setAttribute('aria-pressed',on);b.disabled=!avail;
      b.onclick=()=>{on?st.sel[d].delete(i):st.sel[d].add(i);st.limit=200;render()};
      el.appendChild(b)})})
}
function buildSection(){
  const el=document.getElementById('f-Section');const c={};
  rows.forEach(r=>{if(passes(r,'Section'))c[r.c[3]]=(c[r.c[3]]||0)+1});
  if(st.section!==''&&!c[st.section])st.section='';
  el.innerHTML='<option value="">All sections ('+Object.keys(c).length+')</option>'+
    D.cats.Section.map((v,i)=>c[i]?`<option value="${i}" ${st.section===String(i)?'selected':''}>${esc(v)} · ${c[i]}</option>`:'').join('')
}
function filterLabel(){
  const parts=[];
  if(st.sel.Clg.size)parts.push([...st.sel.Clg].map(i=>D.cats.Clg[i]).join(' + '));
  if(st.sel.Year.size)parts.push([...st.sel.Year].map(i=>D.cats.Year[i]).join(' + '));
  if(st.section!=='')parts.push(D.cats.Section[+st.section]);
  if(st.sel.Group.size)parts.push('Group '+[...st.sel.Group].map(i=>D.cats.Group[i]).join(' + '));
  if(st.fac!=='')parts.push(FAC[+st.fac].n);
  return parts}
function buildFaculty(){
  const el=document.getElementById('f-Faculty');
  const c=FAC.map(fc=>{let k=0;fc.rows.forEach(r=>{if(passes(r,'Faculty'))k++});return k});
  if(st.fac!==''&&!c[+st.fac])st.fac='';
  const avail=FAC.map((fc,i)=>[fc,i]).filter(([,i])=>c[i]).sort((a,b)=>a[0].n.localeCompare(b[0].n));
  el.innerHTML='<option value="">All faculty ('+avail.length+')</option>'+
    avail.map(([fc,i])=>`<option value="${i}" ${st.fac===String(i)?'selected':''}>${esc(fc.n)} · ${fc.b} · ${c[i]}</option>`).join('')
}

/* ---------- downloads ---------- */
const filterSlug=()=>(filterLabel().join('-')||'All-cohorts').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);
const csvEsc=v=>{const s=v==null?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function downloadCSV(filename,headers,rowsArr){
  const lines=[headers.map(csvEsc).join(',')].concat(rowsArr.map(r=>r.map(csvEsc).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const slug=s=>String(s).replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').toLowerCase().slice(0,50)||'data';

/* ---------- small builders ---------- */
const tile=(l,v)=>`<div class="tile"><span class="l">${l}</span><span class="v">${v}</span></div>`;
function levelRow(label,val,total,color,sub){
  const w=total?Math.max(val?1:0,val/total*100):0;
  return `<div class="levelRow"><span class="levelRowLabel" title="${esc(label)}">${esc(label)}</span><div class="levelRowTrack"><div class="levelRowFill" style="width:${w}%;background:${color}"></div></div><span class="levelRowCount">${fmt(val)} <span>${sub??p1(pct(val,total))}</span></span></div>`}
const card=(title,sub,body)=>`<div class="card"><div class="cardHead"><p class="cardTitle">${title}</p><span class="cardSub">${sub||''}</span></div>${body}</div>`;
// section header; with a section id it gets that section's Download Excel button (sectionSheets() below)
const head=(title,note,id)=>`<div class="secHead"><h3 class="sectionTitle">${title}</h3><div class="uTools"><span class="secNote">${note||''}</span>${id?`<button class="reset secDl" type="button" data-sec="${id}" title="This section's numbers and the rows behind them, one sheet each">Download Excel</button>`:''}</div></div>`;
const ICONS={
  learn:'<svg viewBox="0 0 32 32" fill="none"><path d="M4 9l12-5 12 5-12 5-12-5z" fill="white"/><path d="M9 12v7c0 2 3.2 4 7 4s7-2 7-4v-7" stroke="white" stroke-width="2.4" fill="none"/><path d="M28 9v8" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg>',
  practice:'<svg viewBox="0 0 32 32" fill="none"><path d="M10 7 4 16l6 9M22 7l6 9-6 9M18.5 4 13.5 28" stroke="white" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  contest:'<svg viewBox="0 0 32 32" fill="none"><path d="M10 5h12v7a6 6 0 0 1-12 0V5z" fill="white"/><path d="M10 7H5v2a5 5 0 0 0 5 5M22 7h5v2a5 5 0 0 1-5 5" stroke="white" stroke-width="2.2" fill="none"/><path d="M16 18v5M11 27h10" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>'};

/* ---------- sections ---------- */
function pageHeader(f){
  const n=f.length,act=cnt(f,r=>r.m[0]>0),parts=filterLabel();
  document.getElementById('pageHeader').innerHTML=`<h2>${esc(parts.length?parts.join(' · '):'All cohort students')}</h2>
    <p>${fmt(n)} total students${X.since?' &middot; activity since '+X.since:''} &middot; data as of ${X.asof}</p>`;

}

function common(f){
  const n=f.length,act=cnt(f,r=>r.m[0]>0),tot=sum(f,0);
  const b=BUCKETS.map(()=>0);f.forEach(r=>b[r.b]++);
  document.getElementById('secCommon').innerHTML=head('Consumption','for the current filter','secCommon')+
  `<div class="tiles">
    ${tile('Total students',fmt(n))}
    ${tile('Solved ≥1 problem',fmt(act))}
    ${tile('Not started (0 solved)',fmt(n-act))}
    ${tile('Never logged in',fmt(cnt(f,neverLoggedIn)))}
    ${tile('Total problems solved',fmt(tot))}
    ${tile('Avg problems / student',(n?tot/n:0).toFixed(1))}
    ${(()=>{const xf=xm(f),mins=xs(xf,'est_minutes_30'),ac=xs(xf,'all_ac'),sb=xs(xf,'all_subs');
      return tile('Active in last 7 days',fmt(cnt(f,r=>aw(r,3)>0)))+
      tile('Avg time spent ('+WIN+')',hm(xf.length?mins/xf.length:0))+
      tile('Avg accuracy',p1(pct(ac,sb)))})()}
  </div>
  <div class="grid2">
    ${card('Problems solved distribution','students per range',`<div class="levelRows">${BUCKETS.map((x,i)=>levelRow(x[0]+' problems',b[i],n,BCOL[i])).join('')}</div>`)}
    ${card('Where problems were solved','% of total problems solved',`<div class="levelRows">${SRC.map(([l,k,c])=>levelRow(l,xs(f,k),xs(f,'all_solved'),c)).join('')}</div>`)}
  </div>
`
}

// paths assigned through college user groups, merged by name (a path can have one version per section)
function assignedPaths(title,f,ids){
  const g={};
  f.forEach(r=>r.ap.forEach(([p,st])=>{if(!ids.has(p))return;const m=X.paths[p];
    const k=m[0].trim().toLowerCase(),o=g[k]=g[k]||{name:m[0].trim(),ids:new Set(),n:0,s:0,c:0};
    o.ids.add(p);o.n++;if(st===2)o.c++;else if(st===1)o.s++}));
  const list=Object.values(g).sort((a,b)=>b.n-a.n);
  const rowsHtml=list.map(o=>{const segs=[['var(--done)',o.c],['var(--started)',o.s],['var(--none)',o.n-o.c-o.s]]
      .map(([col,v])=>`<div class="labSegment" style="width:${pct(v,o.n)}%;background:${col}${col==='var(--none)'?';color:#626774':''}">${v>=8&&pct(v,o.n)>12?fmt(v):''}</div>`).join('');
    return `<div class="labSectionRow" title="${esc(o.name)}: ${o.c} completed, ${o.s} started, ${o.n-o.c-o.s} not started"><div class="labSectionLabel"><span class="labSectionCode">${esc(o.name)}</span><span class="labSectionStudents">${fmt(o.n)} students assigned${o.ids.size>1?' · '+o.ids.size+' versions':''}</span></div><div class="labSectionTrack">${segs}</div><div class="labSectionPct">${pct(o.c+o.s,o.n).toFixed(0)}%</div></div>`}).join('');
  return `<div class="labProgress"><h4 class="labProgressTitle">${title}</h4>
    <div class="labLegend"><div class="labLegendItem"><span class="labLegendDot" style="background:var(--done)"></span>Completed</div><div class="labLegendItem"><span class="labLegendDot" style="background:var(--started)"></span>Started</div><div class="labLegendItem"><span class="labLegendDot" style="background:var(--none)"></span>Not started</div><div class="labLegendItem" style="margin-left:auto;color:var(--ink-muted)">% = started</div></div>
    <div class="labSectionList pathList">${rowsHtml||'<div class="emptyState">None of these paths are assigned to students in this filter.</div>'}</div></div>`
}

/* One path section. sp = {title, icon, color, noun, pre (column prefix in X), base (students in scope),
   baseLabel, started(r), completed(r) -> paths per student, list (html for right-hand panel or '')} */
function pathSection(id,sp){
  const f=sp.base,n=f.length,key=sp.pre,noun=sp.noun;
  const att=cnt(f,r=>sp.started(r)>0),comp=cnt(f,r=>sp.completed(r)>0);
  const startRate=pct(att,n),xf=xm(f),solved=xs(xf,key+'_solved'),mins=xs(xf,key+'_minutes_30'),
    ac=xs(xf,key+'_ac'),sb=xs(xf,key+'_subs'),acc=sb?p1(pct(ac,sb)):'—';
  const summary=`<div class="labSummary">
      <div class="labSummaryTop"><div class="labIcon" style="background:${sp.color}">${sp.icon}</div>
        <div><p class="labSummaryTitle">${sp.title}</p><span class="labProgressBadge${startRate<50?' warn':''}">${p1(startRate)} started</span></div></div>
      <div class="labMeta">
        <div><div class="labMetaLabel">${sp.baseLabel}</div><div class="labMetaValue">${fmt(n)}</div></div>
        <div><div class="labMetaLabel">Started ≥1</div><div class="labMetaValue">${fmt(att)}</div></div>
        <div><div class="labMetaLabel">Completed ≥1</div><div class="labMetaValue">${fmt(comp)}</div></div>
        <div><div class="labMetaLabel">Completion (of starters)</div><div class="labMetaValue">${att?p1(pct(comp,att)):'—'}</div></div>
        <div><div class="labMetaLabel">Avg accuracy</div><div class="labMetaValue">${acc}</div></div>
        <div><div class="labMetaLabel">Avg time (${WIN})</div><div class="labMetaValue">${hm(n?mins/n:0)}</div></div>
      </div></div>`;
  document.getElementById(id).innerHTML=head(sp.title,sp.note,id)+
  `<div class="tiles">
    ${tile(sp.baseLabel,fmt(n))}
    ${tile('Avg problems solved',(n?solved/n:0).toFixed(1))}
    ${tile('Total problems solved',fmt(solved))}
    ${tile('Active in last 7 days',fmt(cnt(f,r=>saw(r,key,0)>0)))}
    ${tile('Avg time spent ('+WIN+')',hm(n?mins/n:0))}
    ${tile('Avg accuracy',acc)}
  </div>
  ${sp.list?`<div class="labBlock">${summary}${sp.list}</div>`:''}
  ${sp.charts?sp.charts(f,key):''}`
}

const CIDS=new Set(X.college_ids);
const cpCount=(r,min)=>r.ap.reduce((t,[p,st])=>t+(CIDS.has(p)&&st>=min?1:0),0);
const SOLVED_BUCKETS=[['0 problems',0,0,'#e74c3c'],['1–5',1,5,'#f39c12'],['6–10',6,10,'#f1c40f'],['11–25',11,25,'#a3cb38'],['26–50',26,50,'#2ecc71'],['51+',51,1e9,'#1abc9c']];
// two charts for a platform path section: students by problems solved, and most-started paths (merged by name)
function platformCharts(practice,noun){
  return (f,key)=>{
    const xf=xm(f),b=SOLVED_BUCKETS.map(()=>0);
    xf.forEach(r=>{const v=xv(r,key+'_solved')||0;b[SOLVED_BUCKETS.findIndex(x=>v<=x[2])]++});
    const g={};f.forEach(r=>r.pp.forEach(([p,st])=>{const m=X.ppaths[p];if(!m||m[1]!==practice)return;
      const k=m[0].trim().toLowerCase(),o=g[k]=g[k]||{name:m[0].trim(),level:m[2],s:0,c:0};if(st===2)o.c++;else o.s++}));
    const top=Object.values(g).sort((a,b)=>(b.s+b.c)-(a.s+a.c)).slice(0,5),mx=Math.max(1,...top.map(o=>o.s+o.c));
    const pathRows=top.map(o=>{const t=o.s+o.c;
      return `<div class="labSectionRow" title="${esc(o.name)}: ${o.c} completed, ${o.s} started"><div class="labSectionLabel"><span class="labSectionCode">${esc(o.name)}</span><span class="labSectionStudents">${esc(o.level)} · ${fmt(o.c)} completed</span></div>
        <div class="levelRowTrack"><div class="levelRowFill" style="width:${o.c/mx*100}%;background:var(--done)"></div><div class="levelRowFill" style="width:${o.s/mx*100}%;background:var(--started)"></div></div><div class="labSectionPct">${fmt(t)}</div></div>`}).join('');
    return `<div class="grid2">
      ${(()=>{const solvers=xf.length-b[0];
        return card('Students by problems solved','% = of students who solved ≥1',`<div class="levelRows">${SOLVED_BUCKETS.slice(1).map((x,i)=>levelRow(x[0]+' problems',b[i+1],solvers,x[3])).join('')}</div>
        <div class="labMeta" style="border-top:1px solid var(--border-light);padding-top:14px;margin-top:4px">
          <div><div class="labMetaLabel">Solved ≥1 problem</div><div class="labMetaValue">${fmt(solvers)}</div></div>
          <div><div class="labMetaLabel">Solved none</div><div class="labMetaValue">${fmt(b[0])} <span style="font-size:12px;color:var(--ink-muted)">${p1(pct(b[0],xf.length))}</span></div></div>
        </div>`)})()}
      ${card('Most started '+noun+' paths','students who started · top 5',`<div class="labLegend" style="margin-bottom:10px"><div class="labLegendItem"><span class="labLegendDot" style="background:var(--done)"></span>Completed</div><div class="labLegendItem"><span class="labLegendDot" style="background:var(--started)"></span>Started</div></div>
        <div class="labSectionList pathList">${pathRows||'<div class="emptyState">No '+noun+' paths started in this filter.</div>'}</div>`)}
    </div>`}
}
// the college paths in view: all of them, or with a faculty picked only the paths of the subjects they teach
function collegePathIds(){
  if(st.fac==='')return CIDS;
  const want=new Set(FAC[+st.fac].subjects.map(s=>SUBJ_PATH[s]).filter(Boolean));
  return new Set([...CIDS].filter(p=>want.has(X.paths[p][0].trim().toLowerCase())))}
function pathSections(f){
  const ids=collegePathIds(),inIds=(r,min)=>r.ap.reduce((t,[p,s])=>t+(ids.has(p)&&s>=min?1:0),0);
  const cBase=f.filter(r=>r.ap.some(([p])=>ids.has(p)));
  pathSection('secCollege',{title:'College Learning Path',note:st.fac===''?'paths assigned to students by the college':'paths of the subjects this faculty teaches',icon:ICONS.learn,color:'#7c3aed',
    noun:'college',pre:'cl',base:cBase,baseLabel:'Students assigned',started:r=>inIds(r,1),completed:r=>inIds(r,2),
    keep:e=>CCONT.has(e[1]),list:assignedPaths('Assigned College Learning Paths',f,ids)});
  pathSection('secLearning',{title:'Platform Learning Path',note:'CodeChef learning paths students picked up themselves',icon:ICONS.learn,color:'#1476ea',
    noun:'learning',pre:'lp',base:f,baseLabel:'Students',started:r=>r.m[1],completed:r=>r.m[2],keep:e=>e[2]==='learning',list:'',charts:platformCharts(0,'learning')});
  pathSection('secPractice',{title:'Platform Practice Path',note:'CodeChef practice paths',icon:ICONS.practice,color:'#13a85a',
    noun:'practice',pre:'pp',base:f,baseLabel:'Students',started:r=>r.m[3],completed:r=>r.m[4],keep:e=>e[2]==='practice',list:'',charts:platformCharts(1,'practice')});
}

// contests & assessments: CP contests = CodeChef long/cook-off/lunchtime/starters, DSA Mondays, college assessments
function contest(f){
  const xf=xm(f);
  const tCp=xf.reduce((t,r)=>t+cpE(r),0),tMon=xf.reduce((t,r)=>t+monE(r),0);

  // best submission id: spoj.rank_table.best_solution_id for that contest, what the site's own solution links use
  return [[...BASE_COLS.map(c=>c[0]),'Problem code','Problem name','Problem type','Source','Contest code','Contest name','First solved','Best submission ID'],rs]}
// problems.content_type. MCQ, short answer and rearrange answers have no code, and /viewsolution/<id> for them is
// "Submission Not Found", so those ids stay plain text; every other type (coding, labs, trio, web) has a solution page.
const PTYPE={default:'Coding',mcq:'MCQ',short_answer:'Short answer',rearrange:'Rearrange',labs:'Labs',trio:'Trio',html:'HTML',css:'CSS',js:'JS'};
const NO_CODE=new Set(['mcq','short_answer','rearrange']);
// a HYPERLINK formula: Numbers, Excel and Google Sheets show the id as a link to the solution page
const solutionLink=(id,ctype)=>!id?'':NO_CODE.has(ctype)?id:`=HYPERLINK("https://www.codechef.com/viewsolution/${id}","${id}")`;
const solvedIn=(r,cid)=>new Set(r.sp.filter(e=>e[1]===cid).map(e=>e[0])).size;
// one row per (student, contest entered) of the given contest categories
function contestEntriesCSV(list,cats){
  const rs=[];
  list.forEach(r=>(X.pc[r.u[2]]||[]).forEach(([cid,cat])=>{if(cats.includes(cat)){const c=cmeta(cid);rs.push([...base(r),CAT_LABEL[cat],c[0],c[1],solvedIn(r,cid)])}}));
  return [[...BASE_COLS.map(c=>c[0]),'Contest type','Contest code','Contest name','Problems solved in it'],rs]}
// one row per assessment anyone in the list started
function assessmentsCSV(list){
  const g=new Map();
  list.forEach(r=>r.as.forEach(([cid,sc])=>{const o=g.get(cid)||{n:0,ps:0,pn:0,solved:0};o.n++;if(sc!==''){o.ps+=+sc;o.pn++}o.solved+=solvedIn(r,cid);g.set(cid,o)}));
  return [['Assessment code','Assessment name','Students attempted','Avg score %','Problems solved'],
    [...g].sort((a,b)=>b[1].n-a[1].n).map(([cid,o])=>{const c=cmeta(cid);return [c[0],c[1],o.n,o.pn?(o.ps/o.pn).toFixed(1):'',o.solved]})]}
// one row per (student, contest or assessment) they took part in
function participationCSV(list){
  const rs=[];
  list.forEach(r=>{
    (X.pc[r.u[2]]||[]).forEach(([cid,cat])=>{const c=cmeta(cid);rs.push([...base(r),CAT_LABEL[cat],c[0],c[1],'',solvedIn(r,cid)])});
    r.as.forEach(([cid,sc])=>{const c=cmeta(cid);rs.push([...base(r),'Assessment',c[0],c[1],sc,solvedIn(r,cid)])})});
  return [[...BASE_COLS.map(c=>c[0]),'Type','Contest code','Contest name','Score %','Problems solved in it'],rs]}
const STATUS=['Not started','Started','Completed'];
// one row per (student, college path assigned) among the given path ids
function assignedPathsCSV(list,ids){
  const rs=[];
  list.forEach(r=>r.ap.forEach(([p,s])=>{if(ids.has(p))rs.push([...base(r),X.paths[p][0].trim(),p,STATUS[s]])}));
  return [[...BASE_COLS.map(c=>c[0]),'Path name','Path id','Status'],rs]}
// one row per (student, platform path started) of that kind
function pathStartsCSV(list,practice){
  const rs=[];
  list.forEach(r=>r.pp.forEach(([p,s])=>{const m=X.ppaths[p];if(m&&m[1]===practice)rs.push([...base(r),m[0].trim(),m[2],STATUS[s]])}));
  return [[...BASE_COLS.map(c=>c[0]),'Path name','Level','Status'],rs]}
function users(f){
  const body=document.getElementById('uBody'),title=document.getElementById('uTitle'),dlBtn=document.getElementById('uDownload');
  if(!anyFilter()){title.textContent='Student-wise Data';body.innerHTML='<div class="prompt">Apply a filter above (college, year, section, group or faculty) to list <strong>every student</strong> with their metrics.</div>';dlBtn.disabled=true;dlBtn.onclick=null;return}
  const q=st.q.trim().toLowerCase();
  let list=q?f.filter(r=>(r.u.join(' ')).toLowerCase().includes(q)):f.slice();
  const s=st.usort;list.sort((x,y)=>{const a=uval(x,s.k),b=uval(y,s.k);const r=typeof a==='string'?a.localeCompare(b,undefined,{numeric:true}):a-b;return s.asc?r:-r});
  title.textContent='Student-wise Data · '+fmt(list.length);
  dlBtn.disabled=!list.length;
  dlBtn.onclick=()=>{const [h,rs]=studentsCSV(list,UCOLS.slice(3).map(([l,k])=>[l,r=>{const v=uval(r,k);return k[0]==='x'&&v<0?'':v}]));
    downloadCSV(`students_${filterSlug()}.csv`,h,rs)};
  const shown=list.slice(0,st.limit);
  body.innerHTML=`<div class="tw"><table><thead><tr>${UCOLS.map(c=>`<th data-k="${c[1]}" class="${'mx'.includes(c[1][0])?'':'t'}">${c[0]}${s.k===c[1]?(s.asc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${
    shown.map(r=>'<tr>'+UCOLS.map(c=>{const v=uval(r,c[1]);return c[1][0]==='x'?`<td class="${v>0?'':'zero'}">${v<0?'—':v}</td>`:c[1][0]==='m'?`<td class="${v?'':'zero'}">${v}</td>`:`<td class="t">${esc(v)}</td>`}).join('')+'</tr>').join('')||`<tr><td colspan="${UCOLS.length}" class="t zero">No students match</td></tr>`}</tbody></table></div>
    ${list.length>st.limit?`<button class="more" id="umore" type="button">Show ${fmt(Math.min(500,list.length-st.limit))} more (${fmt(shown.length)} of ${fmt(list.length)} shown)</button>`:''}`;
  body.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.usort={k,asc:st.usort.k===k?!st.usort.asc:!'mx'.includes(k[0])};users(filtered())});
  const m=document.getElementById('umore');if(m)m.onclick=()=>{st.limit+=500;users(filtered())};
}

/* searchable dropdown: the hidden <select> keeps the options (built by buildSection / buildFaculty); the input shows the
   picked one, and typing filters the options (every word must match, any order); click / Enter picks, Esc closes */
function combo(selId){
  const sel=document.getElementById(selId),inp=document.getElementById(selId+'-q'),box=inp.parentNode;
  let list=null,items=[],hi=0;
  const label=()=>{const o=sel.options[sel.selectedIndex];inp.value=o?o.text:'';inp.title=inp.value};
  const close=()=>{if(list){list.remove();list=null}label()};
  const pick=v=>{close();if(v!==sel.value){sel.value=v;sel.dispatchEvent(new Event('change'))}else label()};
  const paint=()=>{
    const words=inp.value.toLowerCase().split(/\s+/).filter(Boolean);
    items=[...sel.options].filter(o=>words.every(w=>o.text.toLowerCase().includes(w)));
    hi=Math.min(hi,Math.max(0,items.length-1));
    if(!list){list=document.createElement('ul');list.className='comboList';box.appendChild(list)}
    list.innerHTML=items.length?items.map((o,i)=>`<li data-i="${i}" class="${i===hi?'on':''} ${o.value===sel.value?'sel':''}">${esc(o.text)}</li>`).join('')
      :'<li class="none">No match</li>';
    const on=list.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})};
  inp.addEventListener('focus',()=>{inp.value='';inp.placeholder='Type to search…';hi=0;paint()});
  inp.addEventListener('input',()=>{hi=0;paint()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!list)paint();hi=(hi+(e.key==='ArrowDown'?1:-1)+items.length)%Math.max(1,items.length);paint()}
    else if(e.key==='Enter'){e.preventDefault();if(items[hi]){pick(items[hi].value);inp.blur()}}
    else if(e.key==='Escape'){close();inp.blur()}});
  inp.addEventListener('blur',()=>setTimeout(close,150));
  box.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-i]');if(li){e.preventDefault();pick(items[+li.dataset.i].value);inp.blur()}});
  return label}
const COMBOS=[combo('f-Section'),combo('f-Faculty')];
if(COHORT){
  document.querySelector('#f-Clg').closest('.fgroup').querySelector('.flabel').textContent='Cohort';
  ['f-Year','f-Section','f-Group','f-Faculty'].forEach(id=>document.getElementById(id).closest('.fgroup').hidden=true);
  document.getElementById('secFacPath').hidden=true}
function render(){
  buildFaculty();buildChips();buildSection();COMBOS.forEach(l=>l());const f=filtered();
  pageHeader(f);common(f);
  pathSections(f);if(!COHORT)facPathSection(f);
  contest(f);placement(f);job(f);users(f);
}

document.getElementById('f-Section').onchange=e=>{st.section=e.target.value;st.limit=200;render()};
document.getElementById('f-Faculty').onchange=e=>{st.fac=e.target.value;st.limit=200;render()};
document.getElementById('reset').onclick=()=>{Object.values(st.sel).forEach(s=>s.clear());st.section='';st.fac='';st.q='';document.getElementById('uSearch').value='';render()};
document.getElementById('uSearch').oninput=e=>{st.q=e.target.value;st.limit=200;users(filtered())};

/* ---------- Excel workbook: the report's datasets for the current filter, one sheet each ---------- */
// Summary = every tile on the page as it is rendered now; the other sheets are the same builders the click
// downloads use, so a sheet and the matching CSV always agree.
const summaryIntro=title=>[['DCPD Kargil Cohort Progress Report'+(title?' · '+title:'')],['Filter',filterLabel().join(' · ')||'All cohort students'],
  ['Activity since',X.since||'lifetime'],['Data as of',X.asof],[]];
function summarySheet(){
  const rs=[];
  document.querySelectorAll('section.statsSection').forEach(sec=>{
    const t=(sec.querySelector('.sectionTitle')||{}).textContent||'';
    sec.querySelectorAll('.tile').forEach(el=>{const v=el.querySelector('.v').textContent;
      rs.push([t,el.querySelector('.l').textContent,/^[\d,]+(\.\d+)?$/.test(v)?+v.replace(/,/g,''):v])})});   // "10,037" -> 10037; "4m", "62.3%" stay as shown
  return [['Section','Metric','Value'],rs]}
function workbookSheets(f){
  const cBase=f.filter(r=>r.ap.some(([p])=>CIDS.has(p)));
  const touched=(key,started)=>f.filter(r=>(xv(r,key+'_subs')||0)>0||started(r)>0);
  return [
    ['Summary',summarySheet(),summaryIntro()],
    ['Students',studentsCSV(byDesc(f,r=>r.m[0]),[...COMMON_COLS,...RECENT_COLS.slice(0,7),...LOGIN_COLS,...CONTEST_COLS])],
    ['Problems solved',problemsCSV(f)],
    ['College path students',secSheet('cl','college',cBase,r=>cpCount(r,1),r=>cpCount(r,2))],
    ['College paths assigned',assignedPathsCSV(f,CIDS)],
    ['Learning path activity',secSheet('lp','learning',touched('lp',r=>r.m[1]),r=>r.m[1],r=>r.m[2])],
    ['Learning paths started',pathStartsCSV(f,0)],
    ['Practice path activity',secSheet('pp','practice',touched('pp',r=>r.m[3]),r=>r.m[3],r=>r.m[4])],
    ['Practice paths started',pathStartsCSV(f,1)],
    ['Contests & assessments',participationCSV(f)],
    ['Assessments',assessmentsCSV(f)],
    ...(COHORT?[]:[['Faculty path progress',facPathTableCSV(facPathRows(f))],
    ['Faculty',facultyTableCSV(facSheetRows(f))],
    ['Faculty students',facultyStudentsCSV(facSheetRows(f))]])]}
// one path section's students: recent activity there first, then its problems, time, accuracy and paths
const secSheet=(key,noun,list,started,completed)=>studentsCSV(byDesc(list,r=>saw(r,key,2)*1e6+(xv(r,key+'_solved')||0)),
  [...secRecentCols(key,noun),...pathCols(key,noun,started,completed)]);
// with a faculty picked, the faculty sheets are about that faculty only (not everyone who shares their students)
const facSheetRows=f=>facultyRows(f).filter(x=>st.fac===''||x.i===+st.fac);
// [headers, rows] -> worksheet, with optional intro lines above the header: numeric text becomes numbers
// (identity columns stay text), =HYPERLINK(url, id) becomes a real link cell, column widths fit the content
const KEEP_TEXT=new Set(['Username','Name','Roll no.','Section','Class','Cohort','Problem code','Contest code','Assessment code','Path id']);
function toSheet([hdr,rows],intro=[]){
  const num=(v,ci)=>typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v)&&!/^0\d/.test(v)&&!KEEP_TEXT.has(hdr[ci])?+v:v;
  const aoa=[...intro,hdr,...rows.map(row=>row.map(num))];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const widths=[];
  aoa.forEach((row,ri)=>row.forEach((v,ci)=>{
    const ref=XLSX.utils.encode_cell({r:ri,c:ci}),m=typeof v==='string'&&v.match(/^=HYPERLINK\("([^"]+)","([^"]*)"\)$/);
    if(m)ws[ref]={t:'n',v:+m[2],l:{Target:m[1],Tooltip:'Open solution'}};
    widths[ci]=Math.max(widths[ci]||6,Math.min(50,String(m?m[2]:v??'').length+2))}));
  ws['!cols']=widths.map(w=>({wch:w}));
  return ws}
// builds [[sheet name, [headers, rows], intro lines?]] into an .xlsx; btn shows progress while it works
function writeWorkbook(getSheets,filename,btn){
  if(typeof XLSX==='undefined'){alert('The Excel library could not be loaded. Check your internet connection.');return}
  const lbl=btn.querySelector('span')||btn,orig=lbl.textContent;
  btn.disabled=true;lbl.textContent='Preparing...';
  setTimeout(()=>{   // let the button repaint before the work
    try{
      const wb=XLSX.utils.book_new();
      getSheets().forEach(([name,data,intro])=>XLSX.utils.book_append_sheet(wb,toSheet(data,intro),name.slice(0,31)));
      XLSX.writeFile(wb,filename,{compression:true});
    }catch(e){console.error(e);alert('Could not generate the Excel file.')}
    btn.disabled=false;lbl.textContent=orig},30)}
document.getElementById('downloadXlsxBtn').onclick=e=>writeWorkbook(()=>workbookSheets(filtered()),`DCPD-Kargil-academic-progress_${filterSlug()}.xlsx`,e.currentTarget);

/* ---------- one Download Excel per section: a Summary of what the section shows, then the rows behind it ---------- */
const numOr=v=>/^[\d,]+(\.\d+)?$/.test(v)?+v.replace(/,/g,''):v;   // "9,625" -> 9625; "62.3%", "4m" stay as shown
const txt=(el,sel)=>{const x=sel?el.querySelector(sel):el;return x?x.textContent.trim():''};
// every tile, bar, path row and figure of a rendered section, in page order: Part | Item | Value | Share / detail
function secSummary(id){
  const sec=document.getElementById(id),secTitle=txt(sec,'.sectionTitle'),rs=[];
  sec.querySelectorAll('.tile, .card, .labSummary, .labProgress, .domainCard, .barChartList').forEach(el=>{
    if(el.classList.contains('tile')){rs.push(['Overview',txt(el,'.l'),numOr(txt(el,'.v')),'']);return}
    const part=txt(el,'.cardTitle, .labSummaryTitle, .labProgressTitle, .domainName')||secTitle;
    el.querySelectorAll('.levelRow').forEach(r=>{const c=txt(r,'.levelRowCount, .dCount'),i=c.indexOf(' ');
      rs.push([part,txt(r,'.levelRowLabel, .dLevelLabel'),numOr(i<0?c:c.slice(0,i)),i<0?'':c.slice(i+1)])});
    el.querySelectorAll('.labSectionRow').forEach(r=>rs.push([part,txt(r,'.labSectionCode'),numOr(txt(r,'.labSectionPct')),r.title||txt(r,'.labSectionStudents')]));
    el.querySelectorAll('.labMeta > div').forEach(d=>{const v=txt(d,'.labMetaValue'),i=v.indexOf(' ');
      rs.push([part,txt(d,'.labMetaLabel'),numOr(i<0?v:v.slice(0,i)),i<0?'':v.slice(i+1)])});
    el.querySelectorAll('.barChartRow').forEach(r=>rs.push([part,txt(r,'.barChartLabel'),numOr(txt(r,'.barChartCount')),txt(r,'.barChartDesc')]))});
  return [['Part','Item','Value','Share / detail'],rs]}
// per path section: X key, noun, paths started / completed per student, which solves count, practice flag
const PATHSEC={secCollege:['cl','college',r=>cpCount(r,1),r=>cpCount(r,2),e=>CCONT.has(e[1])],
  secLearning:['lp','learning',r=>r.m[1],r=>r.m[2],e=>e[2]==='learning',0],secPractice:['pp','practice',r=>r.m[3],r=>r.m[4],e=>e[2]==='practice',1]};
function sectionSheets(id,f){
  const title=txt(document.getElementById(id),'.sectionTitle'),S=['Summary',secSummary(id),summaryIntro(title)];
  if(id==='secCommon')return [S,
    ['Students',studentsCSV(byDesc(f,r=>r.m[0]),[['Range',r=>BUCKETS[r.b][0]+' problems'],...COMMON_COLS,...RECENT_COLS.slice(0,7),...LOGIN_COLS])],
    ['Problems solved',problemsCSV(f)]];
  if(PATHSEC[id]){const [key,noun,started,completed,keep,practice]=PATHSEC[id];
    const base=id==='secCollege'?f.filter(r=>r.ap.some(([p])=>CIDS.has(p))):f;
    return [S,['Students',secSheet(key,noun,base,started,completed)],
      id==='secCollege'?['Paths assigned',assignedPathsCSV(f,CIDS)]:['Paths started',pathStartsCSV(f,practice)],
      ['Problems solved',problemsCSV(base,keep)]]}
  if(id==='secContest'){const star=k=>r=>xn(r,k)===''?'':starOf(xv(r,k))+'★';
    const rated=xm(f).filter(r=>xn(r,'rating')!==''||xn(r,'dsa_rating')!=='');
    return [S,['Contests & assessments',participationCSV(f)],['Assessments',assessmentsCSV(f)],
      ['Problems solved',problemsCSV(f,e=>THREE.has(e[2]),true)],
      ['Rated students',studentsCSV(byDesc(rated,r=>xv(r,'rating')),[['CodeChef stars',star('rating')],['DSA Monday band',star('dsa_rating')],...CONTEST_COLS])]]}
  if(id==='secFacPath'){const rs=facPathRows(f);
    return [['Faculty paths',facPathTableCSV(rs),summaryIntro(title)],['Students',facPathStudentsCSV(rs)]]}
  if(id==='secPlacement')return [S,['Students',studentsCSV(f,COMP_ORDER.map(k=>[COMP_LABELS[k],()=>'Unassigned']))]];
  if(id==='secJob')return [S,['Students',studentsCSV(f,[['Job readiness',()=>'Not Ready']])]];
  return [S]}
document.addEventListener('click',e=>{const b=e.target.closest('.secDl');if(!b)return;
  const id=b.dataset.sec;
  writeWorkbook(()=>sectionSheets(id,filtered()),`DCPD-Kargil-${slug(txt(document.getElementById(id),'.sectionTitle'))}_${filterSlug()}.xlsx`,b)});
render();
</script>
